site_name: go-puppetdb docs
site_description: "go-puppetdb — a pure-Go (CGO_ENABLED=0) PuppetDB toolkit: a PQL parser and typed AST, a compiler to canonical AST-query JSON, an in-memory evaluator and a /pdb/query/v4 HTTP client."
site_url: https://go-puppetdb.github.io/docs/
repo_url: https://github.com/go-puppetdb
repo_name: go-puppetdb
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Why pure Go: why.md
  - PQL reference: pql.md
  - Usage & API: api.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
